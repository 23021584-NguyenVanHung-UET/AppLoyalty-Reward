<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loyalty widget · Design studio</title><link rel="stylesheet" href="/preview.css"></head>
<body><header class="studio"><div><span class="kicker">LOCAL DESIGN STUDIO</span><h1>Loyalty, made personal.</h1><p>Preview the shipped widget. All data and discount codes here are fictional.</p></div><span class="tag">No Shopify connection</span></header>
<nav class="controls" aria-label="Preview controls"><label>Surface<select id="surface"><option value="product">Product</option><option value="cart">Cart offers</option></select></label><label>Cart layout<select id="cartLayout"><option value="list">List</option><option value="grid">Cards</option></select></label><label>Scenario<select id="scenario"></select></label><label>Viewport<select id="viewport"><option value="100%">Desktop</option><option value="390px">390px phone</option></select></label><label>Appearance<select id="appearance"><option value="light">Light</option><option value="dark">Dark</option></select></label><label>Language<select id="language"><option value="en">English</option><option value="vi">Tiếng Việt</option></select></label><label>Placement<select id="mode"><option value="floating">Floating launcher</option><option value="inline">Inline panel</option></select></label><label><input id="editor" type="checkbox"> Theme editor preview</label></nav>
<nav class="controls" aria-label="Product estimate controls"><label>Estimate style<select id="estimateStyle"><option value="card">Highlight card</option><option value="pill">Compact badge</option><option value="text">Simple text</option></select></label><label>Estimate icon<select id="estimateIcon"><option value="gift">Gift</option><option value="star">Star</option><option value="none">None</option></select></label><label>Accent color<input id="estimateAccent" type="color" value="#5b37d4"></label><label><input id="estimateHelp" type="checkbox" checked> Show explanation</label></nav>
<main class="canvas"><iframe id="frame" title="Storefront widget preview" src="/frame"></iframe></main><script type="module" src="/preview.js"></script></body></html>
